name: Bug report
description: Report a reproducible FPGA Studio problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include API keys, signing credentials, private keys, or sensitive hardware captures.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include what you expected and what occurred.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS and Mac model
      placeholder: macOS 15.x, Apple M2
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove usernames, local paths, serial numbers, and credentials before posting.
      render: text
  - type: dropdown
    id: hardware
    attributes:
      label: Hardware involvement
      options:
        - No hardware
        - C5G connected, not programmed
        - SRAM programming
        - EPCQ flash programming
