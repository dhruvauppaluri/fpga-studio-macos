name: macOS CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Check repository for credential patterns
        run: ./scripts/check-secrets.sh
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Package development app
        run: ./scripts/package-app.sh
      - name: Verify code signature
        run: codesign --verify --deep --strict --verbose=2 "dist/FPGA Studio.app"
